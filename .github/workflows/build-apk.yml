name: Build Android APK (kaGO.PIaY)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Ensure Android Platform Exists & Sync
        run: |
          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            echo "Android directory or gradlew missing. Initializing Capacitor Android..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/kaGO-PIaY-v1.0.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaGO-PIaY-debug-apk
          path: output/kaGO-PIaY-v1.0.0-debug.apk
          retention-days: 30

      - name: Create GitHub Release (on tag or main dispatch)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/kaGO-PIaY-v1.0.0-debug.apk
          name: kaGO.PIaY Android Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
