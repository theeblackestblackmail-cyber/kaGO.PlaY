name: Build Android APK (kaGO.PIaY)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: |
          rm -f package-lock.json bun.lock
          npm install --force

      - name: Build Web Application
        run: npm run build

      - name: Ensure Capacitor Config Exists
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.kago.play.audio","appName":"kaGO.PIaY","webDir":"dist","server":{"androidScheme":"https","cleartext":true}}' > capacitor.config.json
          fi

      - name: Sync Android Platform
        run: |
          npx cap telemetry off || true
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Prepare Output APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output/kaGO-PIaY-v1.0.0-debug.apk \;
          ls -la output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaGO-PIaY-debug-apk
          path: output/kaGO-PIaY-v1.0.0-debug.apk
          retention-days: 30
