name: Build Android APK (kaGO.PIaY)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Ensure Capacitor Config Exists
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.kago.play.audio","appName":"kaGO.PIaY","webDir":"dist","server":{"androidScheme":"https","cleartext":true}}' > capacitor.config.json
          fi

      - name: Initialize & Sync Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Locate & Prepare Output APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output/kaGO-PIaY-v1.0.0-debug.apk \;
          ls -la output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaGO-PIaY-debug-apk
          path: output/kaGO-PIaY-v1.0.0-debug.apk
          retention-days: 30
