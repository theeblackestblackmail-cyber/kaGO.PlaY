<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24242e"/>
      <stop offset="100%" stop-color="#0c0c0e"/>
    </radialGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5555"/>
      <stop offset="100%" stop-color="#ff1a1a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3e3e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#333340" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff3e3e" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#171717" stroke="url(#borderGrad)" stroke-width="4"/>
  <rect x="36" y="36" width="440" height="440" rx="92" fill="url(#bgGrad)"/>

  <!-- Concentric Turntable Vinyl Grooves subtle background -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#252530" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#2a2a38" stroke-width="1.2" opacity="0.5"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#ff3e3e" stroke-width="1.5" opacity="0.25"/>

  <!-- Glowing Red Triangular Play Button -->
  <polygon points="195,145 375,256 195,367" fill="url(#redGrad)" filter="url(#crimsonGlow)"/>

  <!-- Centered / Inset Audio Badge: kaGO || PlaY -->
  <g transform="translate(256, 420)">
    <!-- Badge Background Capsule -->
    <rect x="-105" y="-22" width="210" height="40" rx="10" fill="#0c0c0e" stroke="#ff3e3e" stroke-width="2"/>
    <text x="0" y="5" fill="#f2efeb" font-family="'Syne', 'Inter', sans-serif" font-weight="900" font-size="19" text-anchor="middle" letter-spacing="2">
      kaGO <tspan fill="#ff3e3e">||</tspan> PlaY
    </text>
  </g>

  <!-- Turntable Center Dot -->
  <circle cx="256" cy="256" r="12" fill="#0c0c0e" stroke="#ffffff" stroke-width="3"/>
  <circle cx="256" cy="256" r="4" fill="#ff3e3e"/>
</svg>
