// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Propagate variables so subprojects find them via project.hasProperty()
    project.ext.set('compileSdkVersion', rootProject.ext.compileSdkVersion)
    project.ext.set('targetSdkVersion', rootProject.ext.targetSdkVersion)
    project.ext.set('minSdkVersion', rootProject.ext.minSdkVersion)
    project.ext.set('androidxActivityVersion', rootProject.ext.androidxActivityVersion)
    project.ext.set('androidxAppCompatVersion', rootProject.ext.androidxAppCompatVersion)
    project.ext.set('androidxCoordinatorLayoutVersion', rootProject.ext.androidxCoordinatorLayoutVersion)
    project.ext.set('androidxCoreVersion', rootProject.ext.androidxCoreVersion)
    project.ext.set('androidxFragmentVersion', rootProject.ext.androidxFragmentVersion)
    project.ext.set('coreSplashScreenVersion', rootProject.ext.coreSplashScreenVersion)
    project.ext.set('androidxWebkitVersion', rootProject.ext.androidxWebkitVersion)

    tasks.whenTaskAdded { task ->
        if (task.name.toLowerCase().contains("aarmetadata")) {
            task.enabled = false
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    taskGraph.allTasks.each { task ->
        if (task.name.toLowerCase().contains("aarmetadata")) {
            task.enabled = false
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
